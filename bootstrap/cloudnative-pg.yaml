# Operador de CloudNativePG con fuentes múltiples: el chart oficial, fijado,
# y el archivo de values desde este repo (ref: values).
# Doc: https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/
# Chart: https://github.com/cloudnative-pg/charts
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.1
      helm:
        releaseName: cnpg
        valueFiles:
          - $values/platform/addons/cloudnative-pg/values.yaml
    - repoURL: https://github.com/jeanlopezxyz/app-gitops.git
      targetRevision: solucion/lab-06
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Los CRD de CloudNativePG superan el límite de la anotación del apply
      # del lado del cliente: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/#server-side-apply
      - ServerSideApply=true
