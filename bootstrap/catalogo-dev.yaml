# catalogo en dev: Argo CD ejecuta `kustomize build` sobre el overlay.
# Doc: https://argo-cd.readthedocs.io/en/stable/user-guide/kustomize/
# El Cluster de CloudNativePG del overlay necesita el operador (Application
# cloudnative-pg); mientras su CRD no existe, el sync falla y se reintenta.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalogo-dev
  namespace: argocd
spec:
  project: team-api
  source:
    repoURL: https://github.com/jeanlopezxyz/app-gitops.git
    targetRevision: solucion/lab-04
    path: apps/catalogo/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: catalogo-dev
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: catalogo-frontend
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
