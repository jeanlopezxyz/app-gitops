# Headlamp desde Git: una sola fuente, el chart envoltorio de platform/addons/headlamp.
# Argo CD detecta Chart.yaml y trata la carpeta como un chart de Helm.
# Doc: https://argo-cd.readthedocs.io/en/stable/user-guide/helm/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jeanlopezxyz/app-gitops.git
    targetRevision: extra/catalogo-operadores   # los values con el plugin de cert-manager
    path: platform/addons/headlamp
    helm:
      releaseName: headlamp
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
