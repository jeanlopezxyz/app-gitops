# External Secrets Operator con fuentes múltiples: chart oficial fijado y
# values desde este repo. Doc: https://external-secrets.io/latest/introduction/getting-started/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.15.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/platform/addons/external-secrets/values.yaml
    - repoURL: https://github.com/jeanlopezxyz/app-gitops.git
      targetRevision: solucion/lab-08
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD grandes, como los de CloudNativePG.
      - ServerSideApply=true
