# Ambiente temporal (laboratorio 4, paso 7): el overlay dev desplegado en un namespace vacío.
# kustomize.namespace y kustomize.patches cambian el namespace y el host sin tocar el overlay.
# Con el finalizer, al quitar este archivo de Git Argo CD borra también sus recursos.
# Fuentes: https://argo-cd.readthedocs.io/en/stable/user-guide/kustomize/
#          https://argo-cd.readthedocs.io/en/stable/user-guide/app_deletion/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalogo-prueba
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: catalogo
  source:
    repoURL: https://github.com/jeanlopezxyz/app-gitops.git # cambiar por tu repo
    targetRevision: trabajo/alumno03
    path: apps/catalogo/overlays/dev
    kustomize:
      namespace: catalogo-prueba
      patches:
        - target:
            kind: Ingress
            name: catalogo
          patch: |
            - op: replace
              path: /spec/rules/0/host
              value: catalogo-prueba-alumno03.argocd-lab.sandbox3477.opentlc.com
  destination:
    server: https://kubernetes.default.svc
    namespace: catalogo-prueba
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
