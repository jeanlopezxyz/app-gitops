# Almacén de secretos del laboratorio: el namespace "secretos" del mismo
# clúster, leído por External Secrets con su provider Kubernetes.
# Hace el papel de un gestor externo (Vault, AWS Secrets Manager...): los
# valores se escriben ahí, fuera de Git, y ESO los copia al namespace de la app.
# Doc: https://external-secrets.io/latest/provider/kubernetes/
apiVersion: v1
kind: Namespace
metadata:
  name: secretos
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-lector
  namespace: secretos
---
# Permisos mínimos que pide la doc del provider: leer Secrets de este
# namespace y crear SelfSubjectRulesReview para validar el store.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-lector
  namespace: secretos
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-lector
  namespace: secretos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-lector
subjects:
  - kind: ServiceAccount
    name: eso-lector
    namespace: secretos
---
# Store de clúster, gestionado por la plataforma. Solo lo pueden usar los
# ExternalSecret de los namespaces listados en conditions.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: almacen-secretos
spec:
  conditions:
    - namespaces:
        - catalogo-dev
        - catalogo-qa
  provider:
    kubernetes:
      remoteNamespace: secretos
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: secretos
      auth:
        serviceAccount:
          name: eso-lector
          namespace: secretos
