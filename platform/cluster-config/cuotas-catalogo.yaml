# Una cuota por ambiente de catalogo (laboratorio 5). La pone la plataforma: el AppProject
# team-api no permite ResourceQuota (laboratorio 3). Cuenta pods, PVC y disco, así no exige
# declarar requests en cada pod (los Jobs de CloudNativePG no los declaran todos).
# Fuente: https://kubernetes.io/docs/concepts/policy/resource-quotas/
apiVersion: v1
kind: ResourceQuota
metadata:
  name: catalogo
  namespace: catalogo-dev
spec:
  hard:
    pods: "15"
    persistentvolumeclaims: "2"
    requests.storage: 4Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: catalogo
  namespace: catalogo-qa
spec:
  hard:
    pods: "15"
    persistentvolumeclaims: "2"
    requests.storage: 4Gi
