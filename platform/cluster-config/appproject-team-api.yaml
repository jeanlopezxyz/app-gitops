# team-api con impersonation (laboratorio 6, paso 6): cada destino se sincroniza con
# team-api-deployer de ese namespace, no con la cuenta de Argo CD.
# Reemplaza a platform/cluster-config/appproject-team-api.yaml del paso 4.
# Fuente: https://argo-cd.readthedocs.io/en/stable/operator-manual/app-sync-using-impersonation/#configuring-destination-service-accounts
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: team-api
  namespace: argocd
spec:
  description: Equipo API (catalogo en dev y qa en el hub, prod en el spoke)
  sourceRepos:
    - https://github.com/jeanlopezxyz/app-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: catalogo-dev
    - server: https://kubernetes.default.svc
      namespace: catalogo-qa
    - name: spoke
      namespace: catalogo-prod
  destinationServiceAccounts:
    - server: https://kubernetes.default.svc
      namespace: catalogo-dev
      defaultServiceAccount: team-api-deployer
    - server: https://kubernetes.default.svc
      namespace: catalogo-qa
      defaultServiceAccount: team-api-deployer
    # destinationServiceAccounts solo acepta "server", no "name": la IP privada del spoke.
    - server: https://10.60.17.69:6443
      namespace: catalogo-prod
      defaultServiceAccount: team-api-deployer
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: NetworkPolicy
