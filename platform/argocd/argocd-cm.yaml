# Configuración de Argo CD: URL pública y SSO con Keycloak por OIDC con PKCE.
# PKCE: cliente público, sin clientSecret; así funciona también `argocd login --sso`.
# Doc: https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/keycloak/#keycloak-and-argo-cd-with-pkce
# Las etiquetas son las de la instalación: Argo CD solo lee sus ConfigMaps con part-of: argocd.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    # Si se borra la Application, el ConfigMap se queda: sin él, Argo CD no arranca bien.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  url: https://argocd-alumno02.argocd-lab.sandbox3477.opentlc.com
  oidc.config: |
    name: Keycloak
    issuer: https://keycloak-alumno02.argocd-lab.sandbox3477.opentlc.com/realms/argocd
    clientID: argocd
    enablePKCEAuthentication: true
    refreshTokenThreshold: 2m
    # El claim "groups" lo agrega un mapper del cliente en Keycloak, sin scope propio.
    requestedScopes: ["openid", "profile", "email", "offline_access"]
  # Paso 6: cambiar a "false" cuando el SSO de administración funcione.
  # Doc: https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/#disable-admin-user
  admin.enabled: "false"
  # Laboratorio 6: cada sync de team-api con la cuenta de su namespace (impersonation, Beta).
  # enforced "false": los proyectos sin destinationServiceAccounts siguen con la cuenta del controller.
  # https://argo-cd.readthedocs.io/en/stable/operator-manual/app-sync-using-impersonation/#configure-enforcement-behavior
  application.sync.impersonation.enabled: "true"
  application.sync.impersonation.enforced: "false"
  # Laboratorio 8: cuenta local del asistente de IA, solo con tokens (apiKey), sin login por la UI.
  # https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/#create-new-user
  accounts.mcp-readonly: apiKey
