# Receptor HTTP de prueba para las notificaciones: responde 200 y escribe en su
# log cada petición que recibe. Solo es accesible dentro del clúster.
# Imagen: https://github.com/mendhak/docker-http-https-echo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receptor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: webhook-receptor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-receptor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-receptor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: mendhak/http-https-echo:43
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: HTTPS_PORT
              value: "8443"
            - name: LOG_WITHOUT_NEWLINE
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receptor
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: webhook-receptor
  ports:
    - name: http
      port: 8080
      targetPort: http
