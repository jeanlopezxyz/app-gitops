# Preparación del spoke. La aplica UNA vez el administrador del spoke, con su
# propio kubeconfig: es lo que Argo CD del hub no puede (ni debe) hacer con una
# credencial acotada a un namespace.
#   kubectl --kubeconfig kubeconfig-spoke.yaml apply --server-side -k platform/spoke
# - El operador de CloudNativePG 1.30.1 (manifiesto oficial de la release, la misma
#   versión que instala el chart 0.29.1 en el hub). Trae CRD y webhooks de clúster.
#   https://cloudnative-pg.io/documentation/current/installation_upgrade/
# - El namespace catalogo-prod y la cuenta argocd-manager que usará Argo CD.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.1/cnpg-1.30.1.yaml
- namespace.yaml
- argocd-manager.yaml
- team-api-deployer.yaml
