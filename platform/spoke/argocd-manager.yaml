# Cuenta con la que Argo CD del hub entra al spoke. Acotada: dueña de
# catalogo-prod y de nada más (ni otros namespaces ni recursos de clúster).
# Es lo que hace "argocd cluster add", pero con un Role en lugar de cluster-admin:
# https://argo-cd.readthedocs.io/en/stable/getting_started/#5-register-a-cluster-to-deploy-apps-to-optional
# https://argo-cd.readthedocs.io/en/stable/operator-manual/security/#cluster-rbac
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: kube-system
---
# Token de larga duración para el Secret de clúster del hub. No rota solo:
# revocarlo es borrar este Secret.
# https://kubernetes.io/docs/concepts/configuration/secret/#serviceaccount-token-secrets
apiVersion: v1
kind: Secret
metadata:
  name: argocd-manager-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: argocd-manager
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-manager
  namespace: catalogo-prod
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-manager
  namespace: catalogo-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-manager
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: kube-system
