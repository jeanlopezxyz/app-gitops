# Orden del despliegue en la fase Sync (laboratorio 4, paso 6), en un solo lugar:
# un parche de Kustomize que agrega la anotación sync-wave a cada recurso.
# Es lo mismo que escribir la anotación en cada manifiesto.
#   wave 0: base de datos · wave 1: migración (la anotas en su Job) · wave 2: API · wave 3: frontend
# Fuente: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/#how-do-i-configure-waves
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: catalogo-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogo-ajustes-v4
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: catalogo-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-frontend
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: v1
kind: Service
metadata:
  name: catalogo-frontend
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalogo
  annotations:
    argocd.argoproj.io/sync-wave: "3"
