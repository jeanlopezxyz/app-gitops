# Crea o actualiza el esquema e inserta los productos de ejemplo. Es idempotente.
# Hook de la fase Sync, wave 1 (laboratorio 4): después de la base de datos, antes de la API.
apiVersion: batch/v1
kind: Job
metadata:
  name: catalogo-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: catalogo-migrate
    app.kubernetes.io/component: api
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalogo-migrate
        app.kubernetes.io/component: api
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/jeanlopezxyz/catalogo-api
          args: ["migrate"]
          env:
            - name: DB_HOST
              value: catalogo-db-rw
            - name: DB_NAME
              value: catalogo
            - name: DB_USER
              value: catalogo
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db-password
              mountPath: /etc/catalogo/db
              readOnly: true
      volumes:
        - name: db-password
          secret:
            secretName: catalogo-db-app
            items:
              - key: password
                path: password
