# PostgreSQL de una instancia gestionado por CloudNativePG.
# El operador crea la base "catalogo", su dueño "catalogo" y el Secret
# catalogo-db-app (username, password, host, uri...) que monta la API.
# Doc: https://cloudnative-pg.io/documentation/current/bootstrap/
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: catalogo-db
spec:
  instances: 1
  # Imagen por defecto de CloudNativePG 1.30.1, fijada.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  bootstrap:
    initdb:
      database: catalogo
      owner: catalogo
  storage:
    size: 1Gi
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "50"
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi
