# La contraseña de la base de datos sale del almacén, no de Git.
# CloudNativePG crea catalogo-db-app; ESO solo reemplaza su clave "password"
# (creationPolicy: Merge). El operador ve el cambio y lo aplica en PostgreSQL,
# y el kubelet actualiza el archivo montado en la API, que lo relee en cada
# conexión nueva: rotar no exige commit, sync ni reinicio.
# Doc: https://external-secrets.io/latest/api/externalsecret/
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalogo-db
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: almacen-secretos
  target:
    name: catalogo-db-app
    creationPolicy: Merge
  data:
    - secretKey: password
      remoteRef:
        key: catalogo-qa-db
        property: password
