# Overlay qa de catalogo: la base sin cambios, más lo propio del ambiente.
# Doc: https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Todos los recursos de la base van a este namespace.
namespace: catalogo-qa

resources:
- ../../base
- externalsecret-db.yaml

# El host del Ingress es un marcador en la base; aquí se pone el real.
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: catalogo-qa-alumno02.argocd-lab.sandbox3477.opentlc.com
  target:
    kind: Ingress
    name: catalogo
replicas:
- count: 2
  name: catalogo-frontend
images:
- name: ghcr.io/jeanlopezxyz/catalogo-api
  newTag: 1.1.0
- name: ghcr.io/jeanlopezxyz/catalogo-frontend
  newTag: 1.1.0
